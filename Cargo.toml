[package]
name = "snapkit"
version = "0.5.2"
edition = "2024"
description = "Free, local and lightweight screen capture for Windows: annotations, scrolling capture, OCR and video"
repository = "https://github.com/MichelGSS/snapkit"
readme = "README.md"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.7.0"
cpal = "0.18.2"
# "glow" (OpenGL): the renderer that allows a transparent window on Windows, used by the selection.
eframe = { version = "0.37.0", features = ["glow"] }
global-hotkey = "0.10.0"
image = "0.25.10"
ort = "2.0.0-rc.15"
raw-window-handle = "0.6.2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
trash = "5.3.0"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
winreg = "0.56.0"
xcap = "0.9.10"

# Dependencies optimized even in development: encoding PNGs and shrinking images
# without optimization would make the library too slow to test.
[profile.dev.package."*"]
opt-level = 2

# The program itself is also optimized in development: the scrolling capture compares
# millions of pixels per shot and would be too slow to test without it.
[profile.dev]
opt-level = 2

[build-dependencies]
winresource = "0.1"

# Distribution: a smaller executable without debug data.
[profile.release]
lto = "thin"
strip = true
