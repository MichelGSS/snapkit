name: Bug report
description: Something in SnapKit doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search the existing issues first.
        Remember to hide any private information in screenshots you attach.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What were you doing, what did you expect, and what happened instead?
      placeholder: |
        1. Pressed Alt+Shift+S
        2. Dragged over an area on my second monitor
        3. Expected… but…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SnapKit version
      description: Shown in the installer file name, Preferences, or package metadata.
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 15.2 (Apple Silicon) / Ubuntu 24.04 (X11 or Wayland)
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitors and scaling
      description: How many monitors, and the resolution and scaling for each monitor.
      placeholder: "2 monitors: 2560×1440 at 125%, 1920×1080 at 100%"
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Windows installer (.exe)
        - Windows portable zip
        - macOS disk image (.dmg)
        - macOS portable zip
        - Linux Debian/Ubuntu package (.deb)
        - Linux portable archive (.tar.gz)
        - Built from source
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images or videos here, if they help.
