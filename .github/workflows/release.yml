# Builds the portable zip, Inno Setup installer, and SHA256SUMS.txt on Windows, uploading workflow
# artifacts on manual dispatch and publishing a GitHub Release on v* tags.
#
# The universal macOS app (.dmg and .zip, signed ad hoc) isn't released yet. Its build runs on
# manual dispatch (artifacts only) and joins tagged releases only when the repository variable
# RELEASE_MACOS is "true"; then publish-macos adds the macOS files and a combined SHA256SUMS.txt
# once both builds have passed.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tagVer = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($cargoVer -ne $tagVer) {
            throw "Tag version ($tagVer) does not match Cargo.toml version ($cargoVer)"
          }
          "Verified SnapKit version $cargoVer"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile

      - name: Ensure winget and Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            $winget = Resolve-Path "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe" -ErrorAction SilentlyContinue |
              Sort-Object Path | Select-Object -Last 1
            if ($winget) {
              Split-Path $winget.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              throw "winget not found on runner"
            }
          }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Fetch FFmpeg
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-ffmpeg.ps1

      - name: Fetch Tesseract OCR
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-tesseract.ps1

      - name: Fetch neural OCR models
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-ocr-neural.ps1

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-onnxruntime.ps1

      - name: Run test suite
        run: cargo test --locked

      - name: Build release packages
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1
          if (-not (Get-ChildItem dist\SnapKit-*-windows-x64.zip -ErrorAction SilentlyContinue)) {
            throw "Portable zip was not created in dist\"
          }
          if (-not (Get-ChildItem dist\SnapKit-*-setup.exe -ErrorAction SilentlyContinue)) {
            throw "Installer setup.exe was not created in dist\"
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Name -match '^SnapKit-.*\.(exe|zip)$' } |
            Sort-Object Name
          if ($files.Count -lt 2) {
            throw "Expected both installer and portable zip in dist\"
          }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist\SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            $utf8NoBom
          )
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapKit-windows-x64
          path: |
            dist/SnapKit-*-setup.exe
            dist/SnapKit-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnapKit-*-setup.exe
            dist/SnapKit-*-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Universal macOS app (Apple silicon and Intel) built by scripts/package-macos.sh. No vendor
  # folders are fetched for macOS yet, so the app ships without FFmpeg, Tesseract and the neural
  # OCR engine; the script includes them when vendor/ has macOS builds.
  macos:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_MACOS == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_ver="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "Tag version ($tag_ver) does not match Cargo.toml version ($cargo_ver)" >&2
            exit 1
          fi
          echo "Verified SnapKit version $cargo_ver"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: cargo test --locked

      - name: Build release packages
        shell: bash
        run: bash scripts/package-macos.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapKit-macos
          path: |
            dist/SnapKit-*-macos.dmg
            dist/SnapKit-*-macos.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  # Adds the macOS files to the release the Windows job published, and replaces SHA256SUMS.txt
  # with one that lists every file. Waiting for both jobs keeps them from racing to create it.
  publish-macos:
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_MACOS == 'true'
    needs: [release, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/SnapKit-windows-x64/SHA256SUMS.txt artifacts/SnapKit-macos/SHA256SUMS-macos.txt |
            sort -k 2 >SHA256SUMS.txt
          cat SHA256SUMS.txt
          [ "$(wc -l <SHA256SUMS.txt)" -ge 4 ] || { echo "Expected four packages in SHA256SUMS.txt" >&2; exit 1; }

      - name: Add the macOS files to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/SnapKit-macos/SnapKit-*-macos.dmg \
            artifacts/SnapKit-macos/SnapKit-*-macos.zip \
            SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
