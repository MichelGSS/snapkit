# Builds the portable zip, Inno Setup installer, and SHA256SUMS.txt on Windows, uploading workflow
# artifacts on manual dispatch and publishing a GitHub Release on v* tags.
#
# The universal macOS app (.dmg and .zip, signed ad hoc) and Linux packages (.deb and .tar.gz)
# run on manual dispatch (artifacts only) and join tagged releases when the repository variables
# RELEASE_MACOS and RELEASE_LINUX are "true"; then publish-extra adds those files and a combined
# SHA256SUMS.txt once all enabled builds have passed.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tagVer = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($cargoVer -ne $tagVer) {
            throw "Tag version ($tagVer) does not match Cargo.toml version ($cargoVer)"
          }
          "Verified SnapKit version $cargoVer"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pefile

      - name: Ensure winget and Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            $winget = Resolve-Path "C:\Program Files\WindowsApps\Microsoft.DesktopAppInstaller_*_x64__8wekyb3d8bbwe\winget.exe" -ErrorAction SilentlyContinue |
              Sort-Object Path | Select-Object -Last 1
            if ($winget) {
              Split-Path $winget.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              throw "winget not found on runner"
            }
          }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Fetch FFmpeg
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-ffmpeg.ps1

      - name: Fetch Tesseract OCR
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-tesseract.ps1

      - name: Fetch neural OCR models
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-ocr-neural.ps1

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-onnxruntime.ps1

      - name: Run test suite
        run: cargo test --locked

      - name: Build release packages
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1
          if (-not (Get-ChildItem dist\SnapKit-*-windows-x64.zip -ErrorAction SilentlyContinue)) {
            throw "Portable zip was not created in dist\"
          }
          if (-not (Get-ChildItem dist\SnapKit-*-setup.exe -ErrorAction SilentlyContinue)) {
            throw "Installer setup.exe was not created in dist\"
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Name -match '^SnapKit-.*\.(exe|zip)$' } |
            Sort-Object Name
          if ($files.Count -lt 2) {
            throw "Expected both installer and portable zip in dist\"
          }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist\SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            $utf8NoBom
          )
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapKit-windows-x64
          path: |
            dist/SnapKit-*-setup.exe
            dist/SnapKit-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnapKit-*-setup.exe
            dist/SnapKit-*-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Universal macOS app (Apple silicon and Intel) built by scripts/package-macos.sh with a
  # universal FFmpeg binary fetched by scripts/fetch-ffmpeg-macos.sh.
  macos:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_MACOS == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_ver="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "Tag version ($tag_ver) does not match Cargo.toml version ($cargo_ver)" >&2
            exit 1
          fi
          echo "Verified SnapKit version $cargo_ver"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Fetch universal FFmpeg
        shell: bash
        run: FFMPEG_ARCH=universal sh scripts/fetch-ffmpeg-macos.sh

      - name: Run test suite
        run: cargo test --locked

      - name: Build release packages
        shell: bash
        run: REQUIRE_UNIVERSAL_HELPERS=1 bash scripts/package-macos.sh

      - name: Verify macOS package
        shell: bash
        run: bash scripts/verify-macos-package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapKit-macos
          path: |
            dist/SnapKit-*-macos.dmg
            dist/SnapKit-*-macos.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  # Linux portable archive (.tar.gz) and Debian/Ubuntu package (.deb) built by
  # scripts/package-linux.sh. Runs on manual dispatch (artifacts only) and joins tagged
  # releases only when the repository variable RELEASE_LINUX is "true".
  linux:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASE_LINUX == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_ver="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$cargo_ver" != "$tag_ver" ]; then
            echo "Tag version ($tag_ver) does not match Cargo.toml version ($cargo_ver)" >&2
            exit 1
          fi
          echo "Verified SnapKit version $cargo_ver"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            xvfb \
            dbus-x11 \
            xclip \
            desktop-file-utils \
            python3

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: xvfb-run -a -s "-screen 0 1280x720x24" dbus-run-session -- cargo test --locked

      - name: Build release packages
        shell: bash
        run: bash scripts/package-linux.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapKit-linux
          path: |
            dist/SnapKit-*-linux-*.tar.gz
            dist/SnapKit-*-linux-*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  # Adds any enabled macOS and Linux packages to the release the Windows job published, and
  # replaces SHA256SUMS.txt with one that lists every file. Waiting for all builds keeps them
  # from racing to upload SHA256SUMS.txt.
  publish-extra:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (vars.RELEASE_MACOS == 'true' || vars.RELEASE_LINUX == 'true') &&
      needs.release.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    needs: [release, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine SHA256SUMS.txt and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sums=(artifacts/*/SHA256SUMS*.txt)
          [ "${#sums[@]}" -ge 2 ] || { echo "Expected Windows and extra checksums" >&2; exit 1; }
          cat "${sums[@]}" | sort -k 2 >SHA256SUMS.txt
          cat SHA256SUMS.txt
          files=(
            artifacts/SnapKit-macos/SnapKit-*-macos.dmg
            artifacts/SnapKit-macos/SnapKit-*-macos.zip
            artifacts/SnapKit-linux/SnapKit-*-linux-*.tar.gz
            artifacts/SnapKit-linux/SnapKit-*-linux-*.deb
            SHA256SUMS.txt
          )
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
