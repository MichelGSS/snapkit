# Builds and tests on every push. The tests that depend on the vendor\ binaries (Tesseract,
# neural models, ONNX Runtime, FFmpeg) skip themselves when the CI variable is set, which GitHub Actions
# does by default.
name: CI

on:
  push:
    branches: [main, macos]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  # Apple Silicon runner. There is no screen permission there, so the tests that photograph the
  # screen only check that nothing crashes.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      # The released app is universal: the Intel half has to compile too.
      - name: Check the Intel build
        run: cargo check --locked --target x86_64-apple-darwin --all-targets
      - name: Check the packaging script
        run: |
          bash -n scripts/package-macos.sh
          if command -v shellcheck >/dev/null 2>&1; then shellcheck scripts/package-macos.sh; fi
