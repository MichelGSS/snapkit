# Builds and tests on every push. The tests that depend on the vendor\ binaries (Tesseract,
# neural models, ONNX Runtime, FFmpeg) skip themselves when the CI variable is set, which GitHub Actions
# does by default.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  # The macOS version isn't released yet; building and testing it on every push keeps Windows
  # changes from breaking it. Apple Silicon runner. There is no screen permission there, so the
  # tests that photograph the screen only check that nothing crashes.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Self-check
        run: ./target/debug/snapkit --self-check
      # The released app is universal: the Intel half has to compile too.
      - name: Check the Intel build
        run: cargo check --locked --target x86_64-apple-darwin --all-targets
      - name: Check the packaging scripts
        run: |
          sh -n scripts/fetch-ffmpeg-macos.sh
          bash -n scripts/package-macos.sh
          bash -n scripts/verify-macos-package.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/fetch-ffmpeg-macos.sh scripts/package-macos.sh scripts/verify-macos-package.sh
          fi

  # The Linux version isn't released yet; building and testing it on every push keeps Windows
  # and macOS changes from breaking it.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libclang-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            xvfb \
            dbus-x11 \
            xclip \
            desktop-file-utils \
            shellcheck \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test under Xvfb
        run: xvfb-run -a -s "-screen 0 1280x720x24" dbus-run-session -- cargo test --locked
      - name: Smoke test self-check and screen capture
        run: |
          ./target/debug/snapkit --self-check
          xvfb-run -a -s "-screen 0 1280x720x24" ./target/debug/snapkit --test-capture /tmp/snapkit-ci-cap.png
          test -s /tmp/snapkit-ci-cap.png
      - name: Check the packaging script
        run: |
          bash -n scripts/package-linux.sh
          shellcheck scripts/package-linux.sh
