<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SnapKit: capture, annotate and document your screen. 100% local, free and open source.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161b"/>
      <stop offset="1" stop-color="#1d2028"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FF8A4C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- selection frame motif -->
  <g transform="translate(905 70)">
    <rect x="0" y="0" width="300" height="200" rx="6" fill="#FF8A4C" fill-opacity="0.07" stroke="#FF8A4C" stroke-width="3" stroke-dasharray="12 9"/>
    <g fill="#1d2028" stroke="#FF8A4C" stroke-width="3">
      <rect x="-7" y="-7" width="14" height="14" rx="3"/>
      <rect x="293" y="-7" width="14" height="14" rx="3"/>
      <rect x="-7" y="193" width="14" height="14" rx="3"/>
      <rect x="293" y="193" width="14" height="14" rx="3"/>
    </g>
    <path d="M40 160 L138 87" stroke="#E5484D" stroke-width="7" stroke-linecap="round"/>
    <path d="M162 69 L126 78 L143 101 Z" fill="#E5484D" stroke="#E5484D" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="215" cy="62" r="22" fill="#2F81F7"/>
    <text x="215" y="71" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">1</text>
    <rect x="185" y="120" width="90" height="16" rx="4" fill="#FFD43B" fill-opacity="0.65"/>
    <rect x="185" y="150" width="70" height="12" rx="3" fill="#a9afbc" fill-opacity="0.35"/>
    <text x="150" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a9afbc">1280 × 800</text>
  </g>

  <!-- logo -->
  <g transform="translate(72 92) scale(1.76)">
    <rect width="100" height="100" rx="22" fill="#FF8A4C"/>
    <path d="M27 53V27H53M73 47V73H47" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="43" y="43" width="14" height="14" fill="#fff"/>
  </g>

  <text x="290" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#f4f5f7">SnapKit</text>
  <text x="294" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#a9afbc">Capture, annotate and document your screen.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#d7dbe3">
    <rect x="294" y="244" width="132" height="40" rx="20" fill="#262a33" stroke="#FF8A4C" stroke-opacity="0.55"/>
    <text x="360" y="270" text-anchor="middle">100% local</text>
    <rect x="438" y="244" width="152" height="40" rx="20" fill="#262a33" stroke="#FF8A4C" stroke-opacity="0.55"/>
    <text x="514" y="270" text-anchor="middle">Free &amp; MIT</text>
    <rect x="602" y="244" width="154" height="40" rx="20" fill="#262a33" stroke="#FF8A4C" stroke-opacity="0.55"/>
    <text x="679" y="270" text-anchor="middle">Lightweight</text>
    <rect x="768" y="244" width="110" height="40" rx="20" fill="#262a33" stroke="#FF8A4C" stroke-opacity="0.55"/>
    <text x="823" y="270" text-anchor="middle">Windows</text>
  </g>
</svg>
